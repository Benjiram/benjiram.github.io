<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/heart.png">
</head>
<body>
    <!-- Background Elements -->
    <div class="background-elements">
        <div class="floating-heart" style="top: 10%; left: 5%;"><i class="fas fa-heart"></i></div>
        <div class="floating-heart" style="top: 20%; left: 90%;"><i class="fas fa-heart"></i></div>
        <div class="floating-heart" style="top: 70%; left: 15%;"><i class="fas fa-heart"></i></div>
        <div class="floating-heart" style="top: 85%; left: 80%;"><i class="fas fa-heart"></i></div>
    </div>
    
    <!-- Main Content -->
    <div class="container">
        <!-- First Screen: Vase with Lilies -->
        <section class="vase-section active" id="vase-section">
            <div class="section-header">
                <h1 class="title">For My Beautiful Valentine</h1>
                <p class="subtitle">You know I love you</p>
            </div>
            
            <div class="vase-container">
                <div class="vase">
                    <div class="vase-top"></div>
                    <div class="vase-body"></div>
                    <div class="vase-base"></div>
                </div>
                
                <div class="flowers-container">
                    <!-- Lilies will be generated by JavaScript -->
                </div>
                
                <div class="sparkle" style="top: 20%; left: 30%;"></div>
                <div class="sparkle" style="top: 40%; left: 70%;"></div>
                <div class="sparkle" style="top: 60%; left: 20%;"></div>
            </div>
            
            <div class="instruction">
                <p>Click on the flowers to see a special message</p>
                <div class="arrow-down">
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
            
            <button class="next-btn" id="next-btn">Next <i class="fas fa-heart"></i></button>
        </section>
        
        <!-- Love Proposal Panel -->
        <section class="proposal-section" id="proposal-section">
            <div class="section-header">
                <h1 class="title">My Dearest Love</h1>
                <p class="subtitle">I have just one question for you...</p>
            </div>
            
            <div class="love-panel">
                <div class="panel-header">
                    <i class="fas fa-heart"></i>
                    <h2>Do you love me? (I dare you to click no)</h2>
                    <i class="fas fa-heart"></i>
                </div>
                
                <div class="panel-body">                    
                    <div class="buttons-container">
                        <button class="btn-yes" id="yes-btn">
                            <i class="fas fa-heart"></i> Yes, of course!
                        </button>
                        <button class="btn-no" id="no-btn">
                            <i class="fas fa-times"></i> No
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="flower-animation-area" id="flower-animation-area">
                <!-- Flowers will appear here when she clicks Yes -->
            </div>
            
            <div class="message-display" id="message-display">
                <!-- Love message will appear here -->
            </div>
        </section>
        
        <!-- Footer -->
        <footer>
            <p>Made with <i class="fas fa-heart" style="color: #ff4d8d;"></i> for my amazing Manar</p>
            <p class="footer-note">Happy Valentine's Day! 💕</p>
        </footer>
    </div>
    
    <!-- Love Messages Modal -->
    <div class="message-modal" id="message-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3><i class="fas fa-quote-left"></i> For You <i class="fas fa-quote-right"></i></h3>
            <p id="modal-message"></p>
            <button class="close-btn">Close</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
